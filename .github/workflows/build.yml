name: Build iOS IPA
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Generate project
        run: xcodegen generate --spec project.yml
      - name: Build unsigned IPA
        run: |
          set -e
          xcodebuild -project DMDMedia.xcodeproj -scheme DMDMedia -configuration Release -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY=- build
          APP=$(find build/Build/Products -name "DMDMedia.app" | head -1)
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry DMDMedia.ipa Payload
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: DMDMedia-ipa
          path: DMDMedia.ipa
